name: CI

on:
  workflow_call:
    inputs:
      audit_history:
        description: Check commit identity metadata before publishing
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit commit identities before publication
        if: inputs.audit_history
        run: npm run privacy:history
