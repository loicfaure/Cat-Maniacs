name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

  package:
    name: Package ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package homepage to this repository
        run: npm pkg set "homepage=${{ github.server_url }}/${{ github.repository }}"

      # The repository disables all lifecycle scripts globally. Run only the
      # audited Electron downloader required to obtain the packaging runtime.
      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Build ${{ matrix.platform }} packages
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cat-dispenser-${{ matrix.platform }}-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: cat-dispenser-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Cha'Mania ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber
