name: Build and release desktop apps

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without creating a tag or release
        required: true
        type: boolean
        default: true
      release_type:
        description: GitHub Release type (ignored for dry runs)
        required: true
        type: choice
        default: stable
        options:
          - stable
          - prerelease
          - draft
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

  package:
    name: Package ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package homepage to this repository
        run: npm pkg set "homepage=${{ github.server_url }}/${{ github.repository }}"

      # The repository disables all lifecycle scripts globally. Run only the
      # audited Electron downloader required to obtain the packaging runtime.
      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Build ${{ matrix.platform }} packages
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cat-dispenser-${{ matrix.platform }}-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.AppImage

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and create release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v${package_version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${release_tag}" = "${GITHUB_REF_NAME}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            tagged_commit="$(git rev-list -n 1 "${release_tag}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "${release_tag} already exists on a different commit." >&2
              exit 1
            fi
          else
            git tag "${release_tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${release_tag}"
          fi

          echo "name=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: cat-dispenser-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.name }}
          RELEASE_TYPE: ${{ inputs.release_type || 'stable' }}
        shell: bash
        run: |
          set -euo pipefail

          create_flags=()
          edit_flags=(--draft=false --prerelease=false)
          case "${RELEASE_TYPE}" in
            stable)
              ;;
            prerelease)
              create_flags+=(--prerelease)
              edit_flags=(--draft=false --prerelease=true)
              ;;
            draft)
              create_flags+=(--draft)
              edit_flags=(--draft=true --prerelease=false)
              ;;
            *)
              echo "Unsupported release type: ${RELEASE_TYPE}" >&2
              exit 1
              ;;
          esac

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" "${edit_flags[@]}" --title "Cha'Mania ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --title "Cha'Mania ${RELEASE_TAG}" "${create_flags[@]}"
          fi

          mapfile -t existing_assets < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')
          for asset in "${existing_assets[@]}"; do
            gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
          done
          gh release upload "${RELEASE_TAG}" release/*.exe release/*.AppImage

  dry-run-summary:
    name: Dry run complete
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Summarize dry run
        run: |
          echo "## Dry run complete" >> "${GITHUB_STEP_SUMMARY}"
          echo "The Windows .exe and Linux .AppImage are available in this workflow run's artifacts. No tag or GitHub Release was created." >> "${GITHUB_STEP_SUMMARY}"
